<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba de JavaScript</title>
<style>
body { background: #0c0f17; color: #e8ecf2; font-family: sans-serif; padding: 24px 60px; }
h1 { color: #00c8ff; }
li { font-size: 16px; margin: 3px 0; }
h1 { margin: 0; }
.ok { color: #3ddc84; }
.no { color: #ff5c5c; }
</style>
</head>
<body>
<h1>Prueba de JavaScript</h1>
<p id="estado">JavaScript NO se ejecutó.</p>
<p id="reloj" style="font-size:28px;color:#00c8ff">Contador: esperando...</p>
<ul id="lista"></ul>
<script>
var lista = document.getElementById('lista');
function prueba(nombre, fn) {
	var li = document.createElement('li');
	var ok = false, extra = '';
	try { ok = fn(); } catch (e) { extra = ' (' + e + ')'; }
	li.className = ok ? 'ok' : 'no';
	li.appendChild(document.createTextNode((ok ? 'OK  ' : 'FALLA  ') + nombre + extra));
	if (lista.firstChild) lista.insertBefore(li, lista.firstChild); else lista.appendChild(li);
}
document.getElementById('estado').textContent = 'JavaScript se ejecutó (motor de EonSurf).';
prueba('getElementById / textContent', function () { return document.getElementById('estado') !== null; });
prueba('createElement / appendChild', function () { return lista.childNodes.length >= 1; });
prueba('innerHTML', function () { var d = document.createElement('div'); d.innerHTML = '<b>x</b>'; return d.firstChild && d.firstChild.nodeName === 'B'; });
prueba('querySelector', function () { return document.querySelector('#lista') === lista; });
prueba('JSON', function () { return JSON.parse(JSON.stringify({a: [1, 2]})).a[1] === 2; });
prueba('setTimeout', function () { setTimeout(function () { prueba('setTimeout (llegó)', function () { return true; }); }, 300); return true; });
prueba('addEventListener', function () { document.body.addEventListener('click', function () {}); return true; });
prueba('classList', function () { return !!document.body.classList; });
prueba('localStorage', function () { localStorage.setItem('eon', '1'); return localStorage.getItem('eon') === '1'; });
prueba('XMLHttpRequest', function () { return typeof XMLHttpRequest !== 'undefined'; });
prueba('fetch', function () { return typeof fetch === 'function'; });
prueba('Promise', function () { return typeof Promise === 'function'; });
prueba('flechas / let (ES6)', function () { return eval('(() => { let a = 2; return a * 2; })()') === 4; });
prueba('clases, async, ?. (ES2020+)', function () { return eval('class A { #x = 1; get x() { return this.#x; } }; (async () => 1)() instanceof Promise && new A().x === 1 && ({})?.a?.b === undefined'); });
prueba('matches / closest', function () { return lista.matches('ul#lista') && lista.closest('body') === document.body; });
prueba('querySelectorAll', function () { return document.querySelectorAll('li.ok').length >= 3; });
Promise.resolve(41).then(function (v) { prueba('Promise.then (llegó)', function () { return v + 1 === 42; }); });
fetch('https://example.com/').then(function (r) { return r.text(); }).then(function (t) {
	prueba('fetch https (llegó ' + t.length + ' bytes)', function () { return t.indexOf('Example Domain') >= 0; });
}, function (e) { prueba('fetch https', function () { throw e; }); });
var x = new XMLHttpRequest();
x.open('GET', 'https://example.com/');
x.onload = function () { prueba('XMLHttpRequest (llegó ' + x.status + ')', function () { return x.responseText.length > 100; }); };
x.onerror = function () { prueba('XMLHttpRequest (error)', function () { return false; }); };
x.send();
prueba('localStorage persistente', function () {
	var visitas = parseInt(localStorage.getItem('visitas') || '0', 10) + 1;
	localStorage.setItem('visitas', String(visitas));
	document.getElementById('estado').textContent += ' Visitas a esta página: ' + visitas + '.';
	return true;
});
prueba('motor: ' + (typeof __ns === 'object' ? 'QuickJS' : 'Duktape'), function () { return true; });
prueba('instanceof HTMLElement', function () { return document.body instanceof HTMLElement && lista instanceof Element; });
prueba('classList.toggle', function () { var d = document.createElement('div'); d.classList.toggle('a'); return d.className === 'a' && d.classList.contains('a'); });
prueba('style', function () { var d = document.createElement('div'); d.style.backgroundColor = 'red'; return /background-color:\s*red/.test(d.getAttribute('style')); });
prueba('dataset', function () { var d = document.createElement('div'); d.dataset.fooBar = '1'; return d.getAttribute('data-foo-bar') === '1'; });
prueba('URL', function () { var u = new URL('../b?x=1#h', 'https://a.com/c/d'); return u.href === 'https://a.com/b?x=1#h' && u.searchParams.get('x') === '1'; });
prueba('CustomEvent', function () { var d = document.createElement('div'), got = 0; d.addEventListener('hola', function (e) { got = e.detail; }); d.dispatchEvent(new CustomEvent('hola', { detail: 7 })); return got === 7; });
prueba('innerHTML get', function () { var d = document.createElement('div'); d.innerHTML = '<b class="x">hi</b>'; return d.innerHTML === '<b class="x">hi</b>'; });
if (typeof MutationObserver === 'function') {
	var mo = new MutationObserver(function (recs) { prueba('MutationObserver (llegó ' + recs.length + ')', function () { return recs.length > 0; }); mo.disconnect(); });
	mo.observe(lista, { childList: true });
}
var n = 0;
setInterval(function () {
	n++;
	document.getElementById('reloj').textContent = 'Contador en vivo: ' + n;
}, 1000);
</script>
</body>
</html>
