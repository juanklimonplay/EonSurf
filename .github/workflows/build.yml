name: EonSurf PS3 CI/CD (Cell B.E. & PKG Builder)

on:
  push:
    branches: [ "main", "feature/**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  eonsurf-pkg:
    runs-on: ubuntu-24.04
    env:
      TITLE_ID: "EONS00001"
      APP_TITLE: "EonSurf Web Browser"
      CONTENT_ID: "UP0001-EONS00001_00-0000000000000000"
      PS3DEV: "/usr/local/ps3dev"
      PSL1GHT: "/usr/local/ps3dev"

    steps:
      - name: 1. Checkout del repositorio
        uses: actions/checkout@v4

      - name: 2. Dependencias del anfitrión
        run: |
          sudo apt-get update
          sudo apt-get install -y texinfo flex bison libgmp-dev libelf-dev libmpfr-dev libmpc-dev \
            zlib1g-dev bzip2 xz-utils patch libtool-bin autoconf automake pkg-config python3-dev wget libncurses-dev gperf perl libhtml-parser-perl libpng-dev

      - name: 3. Preparar permisos para cache de ps3dev
        run: |
          sudo mkdir -p /usr/local/ps3dev
          sudo chown -R $USER:$USER /usr/local/ps3dev

      - name: 4. Cache del kit (ps3toolchain + PSL1GHT + ps3libraries)
        id: kit
        uses: actions/cache@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-${{ hashFiles('docs/TOOLCHAIN.md', 'tools/build-kit.sh') }}

      - name: 5. Compilar el kit si no está en caché
        if: steps.kit.outputs.cache-hit != 'true'
        run: sudo -E bash tools/build-kit.sh

      - name: 6. Configurar PATH del toolchain
        run: |
          echo "${PS3DEV}/bin" >> $GITHUB_PATH
          echo "${PS3DEV}/ppu/bin" >> $GITHUB_PATH
          echo "${PS3DEV}/spu/bin" >> $GITHUB_PATH

      - name: 6b. Compilar libiconv estática para PS3 (newlib no trae iconv)
        run: |
          export PATH=$PATH:${PS3DEV}/bin:${PS3DEV}/ppu/bin
          PREFIX=/usr/local/ps3dev/portlibs/ppu
          if [ ! -f "$PREFIX/lib/libiconv.a" ]; then
            wget -q https://ftp.gnu.org/pub/gnu/libiconv/libiconv-1.17.tar.gz
            tar xzf libiconv-1.17.tar.gz
            cd libiconv-1.17
            CFLAGS="-O2 -mcpu=cell" ./configure --host=powerpc64-ps3-elf --prefix="$PREFIX" \
              --enable-static --disable-shared --disable-nls
            make -C libcharset && make -C libcharset install-lib libdir="$PWD/lib" includedir="$PWD/lib"
            make -C lib
            mkdir -p "$PREFIX/lib"
            cp lib/.libs/libiconv.a "$PREFIX/lib/libiconv.a"
            # NetSurf usa los nombres POSIX (iconv_open/iconv/iconv_close) del header de newlib;
            # GNU libiconv exporta libiconv_*, así que agregamos alias con los nombres POSIX.
            printf '%s\n' '#include <stddef.h>' 'typedef void *iconv_t;' \
              'iconv_t libiconv_open(const char *, const char *);' \
              'size_t libiconv(iconv_t, char **, size_t *, char **, size_t *);' \
              'int libiconv_close(iconv_t);' \
              'iconv_t iconv_open(const char *t, const char *f) { return libiconv_open(t, f); }' \
              'size_t iconv(iconv_t c, char **i, size_t *il, char **o, size_t *ol) { return libiconv(c, i, il, o, ol); }' \
              'int iconv_close(iconv_t c) { return libiconv_close(c); }' > posix_alias.c
            powerpc64-ps3-elf-gcc -O2 -c posix_alias.c -o posix_alias.o
            powerpc64-ps3-elf-ar rcs "$PREFIX/lib/libiconv.a" posix_alias.o lib/../libcharset/lib/.libs/*.o 2>/dev/null || \
              powerpc64-ps3-elf-ar rcs "$PREFIX/lib/libiconv.a" posix_alias.o
          fi
          powerpc64-ps3-elf-nm "$PREFIX/lib/libiconv.a" | grep -E " T (iconv_open|iconv|iconv_close)$"

      - name: 7. Compilar NetSurf completo (HTML5 + CSS + DOM + Framebuffer) para PS3
        run: |
          export PATH=$PATH:${PS3DEV}/bin:${PS3DEV}/ppu/bin:${PS3DEV}/spu/bin
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=/usr/local/ps3dev
          PREFIX=/usr/local/ps3dev/portlibs/ppu
          WORK_DIR="port/work"

          echo "==> Descargando y parchando netsurf-all-3.11..."
          bash port/fetch.sh "$WORK_DIR"
          cd "${WORK_DIR}/netsurf-all-3.11"

          echo "==> Copiando driver surface_ps3.c a libnsfb..."
          cp ../../ps3/surface_ps3.c libnsfb/src/surface/ps3.c

          echo "==> Compilando stack completo de NetSurf para Cell B.E. (HOST=powerpc64-ps3-elf)..."
          make TARGET=framebuffer HOST=powerpc64-ps3-elf NETSURF_FB_FONTLIB=internal Q= || true
          ls -la inst-framebuffer/lib/ || true
          ls -la netsurf/ || true
          if [ -f "netsurf/nsfb" ]; then
            echo "[OK] netsurf/nsfb compilado exitosamente!"
            ls -lh netsurf/nsfb
          else
            echo "::error::NetSurf (nsfb) NO enlazo; el PKG de este run es el respaldo viejo"
          fi

      - name: 8. Compilar EonSurf (Cell B.E. + AltiVec) & Empaquetar PKG
        run: |
          export PATH=$PATH:${PS3DEV}/bin:${PS3DEV}/ppu/bin:${PS3DEV}/spu/bin
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=/usr/local/ps3dev
          PREFIX=/usr/local/ps3dev/portlibs/ppu
          WORK_DIR="port/work"

          mkdir -p build-eonsurf
          mkdir -p pkg_build/USRDIR

          if [ -d "startpage" ]; then cp -r startpage pkg_build/USRDIR/; fi
          if [ -f "pkg/ICON0.PNG" ]; then
            cp pkg/ICON0.PNG pkg_build/ICON0.PNG
          elif [ -f "src/pkg/ICON0.PNG" ]; then
            cp src/pkg/ICON0.PNG pkg_build/ICON0.PNG
          fi
          if [ -f "pkg/PIC1.PNG" ]; then cp pkg/PIC1.PNG pkg_build/PIC1.PNG; fi
          if [ -f "pkg/eonsurf.cfg" ]; then cp pkg/eonsurf.cfg pkg_build/USRDIR/; fi

          INC_FLAGS="-Isrc/source -Iport/ps3 -I${PSL1GHT}/include -I${PSL1GHT}/ppu/include -I${PREFIX}/include -I${WORK_DIR}/netsurf-all-3.11/libnsfb/include -I${WORK_DIR}/netsurf-all-3.11/libnsfb/src -I${WORK_DIR}/netsurf-all-3.11/libnsfb/src/plot"
          LIB_FLAGS="-L${PSL1GHT}/lib -L${PSL1GHT}/ppu/lib -L${PREFIX}/lib"

          NSFB_DIR="${WORK_DIR}/netsurf-all-3.11/libnsfb"
          NSFB_SOURCES="
            ${NSFB_DIR}/src/libnsfb.c
            ${NSFB_DIR}/src/cursor.c
            ${NSFB_DIR}/src/palette.c
            ${NSFB_DIR}/src/surface/surface.c
            ${NSFB_DIR}/src/surface/ram.c
            ${NSFB_DIR}/src/plot/api.c
            ${NSFB_DIR}/src/plot/util.c
            ${NSFB_DIR}/src/plot/generic.c
            ${NSFB_DIR}/src/plot/32bpp-xrgb8888.c
            ${NSFB_DIR}/src/plot/32bpp-xbgr8888.c
            ${NSFB_DIR}/src/plot/16bpp.c
            ${NSFB_DIR}/src/plot/8bpp.c
          "

          if [ -f "${WORK_DIR}/netsurf-all-3.11/netsurf/nsfb" ]; then
            echo "[OK] netsurf/nsfb compilado! Preparando binario principal EonSurf..."
            cp "${WORK_DIR}/netsurf-all-3.11/netsurf/nsfb" build-eonsurf/EonSurf.elf
          else
            echo "[CC] Compilando fuentes EonSurf y libnsfb..."
            for src_file in src/source/main.c port/ps3/osk_ps3.c port/ps3/surface_ps3.c ${NSFB_SOURCES}; do
              obj_file="build-eonsurf/$(basename "${src_file%.c}.o")"
              powerpc64-ps3-elf-gcc -O2 -mcpu=cell -maltivec -mabi=altivec -DNSFB_PS3_AVAILABLE -Wall \
                ${INC_FLAGS} -c "${src_file}" -o "${obj_file}"
            done

            echo "[LD] Enlazando EonSurf.elf..."
            powerpc64-ps3-elf-gcc build-eonsurf/*.o \
              ${LIB_FLAGS} \
              -lrsx -lgcm_sys -lio -lfont -laudio \
              -Wl,--start-group -lcurl -lmbedtls -lmbedx509 -lmbedcrypto -lz -lnet -lsysutil -lsysmodule -lm -lrt -llv2 -Wl,--end-group \
              -o build-eonsurf/EonSurf.elf
          fi

          if command -v sprxlinker >/dev/null 2>&1; then
            echo "[OPD] Ejecutando sprxlinker..."
            sprxlinker build-eonsurf/EonSurf.elf
          fi

          if command -v make_fself >/dev/null 2>&1; then
            make_fself build-eonsurf/EonSurf.elf build-eonsurf/EBOOT.BIN || true
          elif command -v fself >/dev/null 2>&1; then
            fself build-eonsurf/EonSurf.elf build-eonsurf/EBOOT.BIN || true
          fi

          if command -v make_self_npdrm >/dev/null 2>&1 && make_self_npdrm build-eonsurf/EonSurf.elf pkg_build/USRDIR/EBOOT.BIN "${CONTENT_ID}"; then
            echo "[OK] EBOOT.BIN firmado con make_self_npdrm"
          elif command -v make_fself_npdrm >/dev/null 2>&1 && make_fself_npdrm build-eonsurf/EonSurf.elf pkg_build/USRDIR/EBOOT.BIN; then
            echo "[OK] EBOOT.BIN firmado con make_fself_npdrm"
          else
            cp build-eonsurf/EonSurf.elf pkg_build/USRDIR/EBOOT.BIN
          fi

          if [ -f "pkg_build/USRDIR/EBOOT.BIN" ] && [ ! -f "build-eonsurf/EBOOT.BIN" ]; then
            cp pkg_build/USRDIR/EBOOT.BIN build-eonsurf/EBOOT.BIN
          fi

          if command -v sfo.py >/dev/null 2>&1; then
            sfo.py --title "${APP_TITLE}" --appid "${TITLE_ID}" -f src/pkg/sfo.xml pkg_build/PARAM.SFO || true
          elif command -v sfo >/dev/null 2>&1; then
            sfo --title "${APP_TITLE}" --appid "${TITLE_ID}" -f src/pkg/sfo.xml pkg_build/PARAM.SFO || true
          fi

          if command -v pkg.py >/dev/null 2>&1; then
            pkg.py --contentid "${CONTENT_ID}" pkg_build/ EonSurf-v0.3.1-alpha.pkg
          elif command -v pkg_builder >/dev/null 2>&1; then
            pkg_builder -c pkg/eonsurf_pkg.conf pkg_build/ EonSurf-v0.3.1-alpha.pkg
          elif command -v pkg >/dev/null 2>&1; then
            pkg --contentid "${CONTENT_ID}" pkg_build/ EonSurf-v0.3.1-alpha.pkg
          fi

          ls -lh EonSurf-*.pkg pkg_build/USRDIR/EBOOT.BIN build-eonsurf/EonSurf.elf

      - name: 9. Subir Artefactos al Build
        uses: actions/upload-artifact@v4
        with:
          name: EonSurf-Navegador-pkg
          path: |
            EonSurf-*.pkg
            pkg_build/USRDIR/EBOOT.BIN
            build-eonsurf/EonSurf.elf
          retention-days: 30
