name: EonSurf PS3 CI/CD (Cell B.E. & PKG Builder)

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-ps3-pkg:
    name: Compilar EonSurf (EONS00001) & Generar PKG
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Checkout del repositorio EonSurf
        uses: actions/checkout@v4

      - name: 2. Dependencias del anfitrion
        run: |
          sudo apt-get update
          sudo apt-get install -y texinfo flex bison libgmp-dev libelf-dev libmpfr-dev libmpc-dev \
            zlib1g-dev bzip2 xz-utils patch libtool-bin autoconf automake pkg-config python3-dev wget libncurses-dev gperf perl

      - name: 3. Cache del kit (ps3toolchain + PSL1GHT + ps3libraries)
        id: kit
        uses: actions/cache@v4
        with:
          path: /usr/local/ps3dev
          key: ps3dev-${{ hashFiles('docs/TOOLCHAIN.md', 'tools/build-kit.sh') }}

      - name: 4. Compilar el kit
        if: steps.kit.outputs.cache-hit != 'true'
        run: sudo -E bash tools/build-kit.sh

      - name: 5. Compilar EonSurf y empaquetar PKG
        run: |
          export PS3DEV=/usr/local/ps3dev PSL1GHT=/usr/local/ps3dev
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          bash port/ps3/build-ps3.sh

      - name: 6. Subir Artefactos (PKG Instalable + Binario RPCS3)
        uses: actions/upload-artifact@v4
        with:
          name: EonSurf-PS3-Build-${{ github.sha }}
          path: |
            EonSurf-*.pkg
            build-eonsurf/EBOOT.BIN
            build-eonsurf/EonSurf.elf
          retention-days: 30
